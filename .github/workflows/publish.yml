name: Publish Packages

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  id-token: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '#ignore') }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release

      - name: Get next version
        id: versioning
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: false
          DRY_RUN: true
          PRERELEASE: false
          RELEASE_BRANCHES: master

      - name: Pack OozSharp
        run: dotnet pack ./src/OozSharp/OozSharp.csproj -c Release -p:PackageVersion=${{ steps.versioning.outputs.new_tag }} --output ./OozSharp

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Shiqan

      - name: Publish OozSharp
        run: dotnet nuget push ./OozSharp/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --no-symbols

      - name: Update Unreal.Encryption Reference
        run: sed -i 's/ProjectReference Include="..\\OozSharp\\OozSharp.csproj"/PackageReference Include="OozSharp" Version="${{ steps.versioning.outputs.new_tag }}"/' ./src/Unreal.Encryption/Unreal.Encryption.csproj

      - name: Pack Unreal.Encryption
        uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 300
          command: dotnet nuget locals http-cache -c && dotnet pack ./src/Unreal.Encryption/Unreal.Encryption.csproj -c Release -p:PackageVersion=${{ steps.versioning.outputs.new_tag }} --output ./Unreal.Encryption

      - name: Publish Unreal.Encryption
        run: dotnet nuget push ./Unreal.Encryption/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --no-symbols

      - name: Pack Unreal.Core
        run: dotnet pack ./src/Unreal.Core/Unreal.Core.csproj -c Release -p:PackageVersion=${{ steps.versioning.outputs.new_tag }} --output ./Unreal.Core

      - name: Publish Unreal.Core
        run: dotnet nuget push ./Unreal.Core/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --no-symbols

      - name: Update FortniteReplayReader References
        run: |
          sed -i 's/ProjectReference Include="..\\Unreal.Core\\Unreal.Core.csproj"/PackageReference Include="Unreal.Core" Version="${{ steps.versioning.outputs.new_tag }}"/' ./src/FortniteReplayReader/FortniteReplayReader.csproj
          sed -i 's/ProjectReference Include="..\\Unreal.Encryption\\Unreal.Encryption.csproj"/PackageReference Include="Unreal.Encryption" Version="${{ steps.versioning.outputs.new_tag }}"/' ./src/FortniteReplayReader/FortniteReplayReader.csproj

      - name: Pack FortniteReplayReader
        uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 300
          command: dotnet nuget locals http-cache -c && dotnet pack ./src/FortniteReplayReader/FortniteReplayReader.csproj -c Release -p:PackageVersion=${{ steps.versioning.outputs.new_tag }} --output ./FortniteReplayReader

      - name: Publish FortniteReplayReader
        run: dotnet nuget push ./FortniteReplayReader/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --no-symbols

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: false
          PRERELEASE: false
          RELEASE_BRANCHES: master
