name: Build

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.x

      - name: Build
        run: dotnet build ./FortniteReplayDecompressor.slnx --configuration Release

      - name: Test
        run: dotnet test ./FortniteReplayDecompressor.slnx --no-build --configuration Release --coverage --coverage-output-format lcov --coverage-output src/coverage/lcov.info